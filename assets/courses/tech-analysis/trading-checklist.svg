<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f7fafc"/>
  <text x="70" y="86" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#0f172a">技术分析实战检查表</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="132" width="1060" height="84" rx="18" fill="#ffffff" stroke="#d7dee8"/>
    <circle cx="118" cy="174" r="18" fill="#2563eb"/><text x="112" y="181" font-size="20" font-weight="700" fill="#fff">1</text>
    <text x="158" y="166" font-size="24" font-weight="700" fill="#0f172a">先判断市场环境</text>
    <text x="158" y="196" font-size="18" fill="#64748b">趋势行情用 MA / BOLL / SAR，震荡行情降低追涨杀跌频率。</text>
    <rect x="70" y="238" width="1060" height="84" rx="18" fill="#ffffff" stroke="#d7dee8"/>
    <circle cx="118" cy="280" r="18" fill="#16a34a"/><text x="112" y="287" font-size="20" font-weight="700" fill="#fff">2</text>
    <text x="158" y="272" font-size="24" font-weight="700" fill="#0f172a">再找同向信号</text>
    <text x="158" y="302" font-size="18" fill="#64748b">价格、均线、MACD、RSI、成交量至少有两类信号互相支持。</text>
    <rect x="70" y="344" width="1060" height="84" rx="18" fill="#ffffff" stroke="#d7dee8"/>
    <circle cx="118" cy="386" r="18" fill="#f59e0b"/><text x="112" y="393" font-size="20" font-weight="700" fill="#fff">3</text>
    <text x="158" y="378" font-size="24" font-weight="700" fill="#0f172a">过滤假突破</text>
    <text x="158" y="408" font-size="18" fill="#64748b">没有成交量配合、指标背离、长上影放量，都要降低交易级别。</text>
    <rect x="70" y="450" width="1060" height="84" rx="18" fill="#ffffff" stroke="#d7dee8"/>
    <circle cx="118" cy="492" r="18" fill="#e11d48"/><text x="112" y="499" font-size="20" font-weight="700" fill="#fff">4</text>
    <text x="158" y="484" font-size="24" font-weight="700" fill="#0f172a">最后写清退出条件</text>
    <text x="158" y="514" font-size="18" fill="#64748b">入场前确定止损位、无效条件和仓位上限，避免用情绪补仓。</text>
  </g>
</svg>
