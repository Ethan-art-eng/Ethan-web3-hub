<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="76" y="86" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">多指标实战：不要堆指标，要有顺序</text>
  <g font-family="Arial,sans-serif">
    <rect x="90" y="150" width="185" height="120" rx="18" fill="#e8f2ff" stroke="#93c5fd"/>
    <text x="128" y="198" font-size="24" font-weight="700" fill="#1d4ed8">趋势</text><text x="120" y="232" font-size="18" fill="#334155">MA / BOLL</text>
    <path d="M285 210H365" stroke="#94a3b8" stroke-width="5" marker-end="url(#a)"/>
    <rect x="380" y="150" width="185" height="120" rx="18" fill="#ecfdf3" stroke="#86efac"/>
    <text x="418" y="198" font-size="24" font-weight="700" fill="#166534">位置</text><text x="408" y="232" font-size="18" fill="#334155">支撑 / 压力</text>
    <path d="M575 210H655" stroke="#94a3b8" stroke-width="5" marker-end="url(#a)"/>
    <rect x="670" y="150" width="185" height="120" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="708" y="198" font-size="24" font-weight="700" fill="#c2410c">动能</text><text x="700" y="232" font-size="18" fill="#334155">MACD / RSI</text>
    <path d="M865 210H945" stroke="#94a3b8" stroke-width="5" marker-end="url(#a)"/>
    <rect x="960" y="150" width="185" height="120" rx="18" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="998" y="198" font-size="24" font-weight="700" fill="#b91c1c">风控</text><text x="990" y="232" font-size="18" fill="#334155">止损 / 仓位</text>
    <rect x="170" y="360" width="860" height="112" rx="18" fill="#fff" stroke="#d7dee8"/>
    <text x="210" y="408" font-size="24" font-weight="700" fill="#0f172a">评分思路</text>
    <text x="210" y="446" font-size="20" fill="#475569">趋势清晰 + 位置明确 + 动能同向 + 成交量确认 + 情绪不过热 + 止损清楚</text>
  </g>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
